services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: anime_pulse
      POSTGRES_USER: anime_pulse
      POSTGRES_PASSWORD: anime_pulse
    ports:
      - "5432:5432"
    volumes:
      - anime-pulse-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anime_pulse -d anime_pulse"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  anime-pulse-postgres:
