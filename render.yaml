services:
  # 1. AnimePulse Web Service (Next.js Application)
  - type: web
    name: anime-pulse-web
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm run db:deploy && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: anime-pulse-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: AUTH_URL
        sync: false
      - key: DATA_ENCRYPTION_KEY
        generateValue: true
      - key: WATCHMODE_API_KEY
        sync: false
      - key: CRON_SECRET
        generateValue: true

  # 2. Scheduled Cron Job Service (Release Pipeline)
  - type: cron
    name: anime-pulse-scheduler
    runtime: node
    plan: starter
    schedule: "*/5 * * * *"
    buildCommand: npm ci && npx prisma generate
    startCommand: npm run scheduler
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: anime-pulse-db
          property: connectionString
      - key: DATA_ENCRYPTION_KEY
        fromService:
          type: web
          name: anime-pulse-web
          envVarKey: DATA_ENCRYPTION_KEY
      - key: WATCHMODE_API_KEY
        fromService:
          type: web
          name: anime-pulse-web
          envVarKey: WATCHMODE_API_KEY

databases:
  # 3. Managed PostgreSQL Database Resource
  - name: anime-pulse-db
    databaseName: anime_pulse
    user: anime_pulse
    plan: starter
