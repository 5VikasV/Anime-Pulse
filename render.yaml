services:
  # 1. AnimePulse Web Service (Next.js Application)
  - type: web
    name: anime-pulse-web
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run db:deploy && npm start
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: anime-pulse-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: AUTH_URL
        sync: false
      - key: DATA_ENCRYPTION_KEY
        generateValue: true
      - key: WATCHMODE_API_KEY
        sync: false
      - key: CRON_SECRET
        generateValue: true

databases:
  # 2. Managed PostgreSQL Database Resource
  - name: anime-pulse-db
    databaseName: anime_pulse
    user: anime_pulse
    plan: free

